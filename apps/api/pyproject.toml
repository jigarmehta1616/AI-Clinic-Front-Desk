[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clinicdesk"
version = "0.1.0"
description = "ClinicDesk AI — WhatsApp-first clinic front desk"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.11",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.40",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "redis>=5.2",
  "arq>=0.26",
  "pyjwt>=2.9",
  "structlog>=24.4",
  "httpx>=0.28",
  "tzdata>=2024.2",
  "python-multipart>=0.0.18",  # Exotel posts form-encoded webhooks
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.8", "mypy>=1.13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: needs PostgreSQL (docker compose up -d db)"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "B008", "RUF012", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "E501", "RUF015", "F811"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = false
warn_unused_ignores = true
[[tool.mypy.overrides]]
module = ["clinicdesk.core.*", "clinicdesk.modules.*.policy", "clinicdesk.modules.queue.ordering", "clinicdesk.modules.messaging.quiet_hours"]
strict = true
